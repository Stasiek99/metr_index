<div class="shell">
  <header class="shell__nav">
    <span class="shell__brand">Metr Index</span>
    <nav>
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active">{{ link.label }}</a>
      }
    </nav>

    <button
      pButton
      type="button"
      variant="text"
      rounded
      iconOnly
      severity="secondary"
      class="shell__theme-toggle"
      [attr.aria-label]="theme.isDark() ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'"
      (click)="theme.toggle()"
    >
      @if (theme.isDark()) {
        <svg data-p-icon="sun"></svg>
      } @else {
        <svg data-p-icon="moon"></svg>
      }
    </button>
  </header>

  <div class="shell__body">
    <aside class="shell__sidebar">
      <h2>Filtry</h2>
      <div class="shell__field">
        <span id="filter-market-label">Rynek</span>
        <p-selectbutton
          [options]="marketOptions"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          [ngModel]="filters.market()"
          (ngModelChange)="filters.market.set($event)"
          ariaLabelledBy="filter-market-label"
        />
      </div>
      <div class="shell__field">
        <span id="filter-price-type-label">Typ ceny</span>
        <p-selectbutton
          [options]="priceTypeOptions"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          [ngModel]="filters.priceType()"
          (ngModelChange)="filters.priceType.set($event)"
          ariaLabelledBy="filter-price-type-label"
        />
      </div>
    </aside>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</div>
